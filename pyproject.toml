[project]
name = "hermes-legal"
version = "0.1.0"
description = "Local-first legal work desktop: matter workspaces, document editing, verified citations, and privacy-first AI that shares no data by default"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
pdf = ["pypdf>=5"]

[project.scripts]
legal = "hermes_legal.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
  "live: calls a real external legal data service. Run explicitly: uv run pytest -m live",
]
