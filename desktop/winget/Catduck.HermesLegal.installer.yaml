# Installer manifest for winget. Two installers are published from the
# same signed release: the NSIS installer (default for winget) and the
# MSI installer (for managed deployments).
#
# InstallerSha256 is intentionally omitted in this scaffold. winget
# requires the hash of the exact signed file, so it is computed from the
# built artifact and added by the release publish step. Committing a
# hash before that artifact exists would be a fabricated value.
PackageIdentifier: Catduck.HermesLegal
PackageVersion: 0.1.0
MinimumOSVersion: 10.0.17763.0
ReleaseDate: 2026-11-09
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    InstallerUrl: https://github.com/catduckgnaf/hermes-legal/releases/download/v0.1.0/hermes-legal_0.1.0_x64-setup.exe
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
  - Architecture: x64
    InstallerType: msi
    InstallerUrl: https://github.com/catduckgnaf/hermes-legal/releases/download/v0.1.0/hermes-legal_0.1.0_x64_en-US.msi
    InstallerSwitches:
      Silent: /quiet /norestart
      SilentWithProgress: /passive /norestart
ManifestType: installer
ManifestVersion: 1.6.0
