[package]
name = "hermes-legal-desktop"
version = "0.1.0"
description = "Tauri 2 shell for the hermes-legal thin desktop client for Hermes"
authors = ["catduckgnaf"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hermes_legal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
] }

[profile.release]
opt-level = 3
lto = true
