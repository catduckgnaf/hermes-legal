name: Contribution checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  contribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the PR body against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > /tmp/pr-files.txt
          jq -n --arg body "$PR_BODY" --rawfile files /tmp/pr-files.txt \
            '{body: $body, files: ($files | split("\n") | map(select(length > 0)))}' > /tmp/pr-metadata.json
          python3 scripts/check_contribution.py --metadata /tmp/pr-metadata.json
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: US spelling in added Markdown lines
        run: python3 scripts/check_us_spelling.py --base origin/${{ github.base_ref }}
