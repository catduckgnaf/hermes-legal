name: Desktop

# Two entry points:
# - Pull requests that touch desktop/** run the client tests against
#   the mock Hermes server and unsigned Windows (NSIS + MSI) and Linux
#   (deb + AppImage) builds. Both platforms are v1.
# - workflow_dispatch keeps the full build: both platforms, all bundle
#   targets, signing secrets wired in. Release builds additionally
#   need the signing secrets; a build without them is unsigned and its
#   artifacts are for smoke testing only.
on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: "Build as a signed release (requires the signing secrets in desktop/packaging.md)"
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client-tests:
    name: client tests (mock Hermes server)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the desktop client tests against the mock Hermes server
        working-directory: desktop
        run: npm test

  build-windows-pr:
    name: build-windows (pull request)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Signing material is provided only through repository secrets.
      # Nothing is committed to this repository: no certificate, no
      # private key, no placeholder value. When a secret is absent the
      # build is unsigned and its artifacts are for smoke testing only;
      # they are never published as a release. See desktop/packaging.md.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the desktop client tests against the mock Hermes server
        shell: bash
        working-directory: desktop
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the Tauri app for Windows (unsigned smoke build)
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles nsis,msi

      - name: Silent NSIS install, launch, and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse -Path desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          $installed = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "NSIS installer exited $($installed.ExitCode)" }
          $roots = @(
            "$env:LOCALAPPDATA\hermes-legal",
            "$env:LOCALAPPDATA\Programs\hermes-legal",
            "$env:APPDATA\hermes-legal"
          )
          $exe = $null
          foreach ($name in @("hermes-legal.exe", "hermes-legal-desktop.exe")) {
            $exe = Get-ChildItem -Path $roots -Filter $name -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) {
            Write-Host "Searched: $($roots -join ', ')"
            Get-ChildItem -Path $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter "hermes-legal*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "installed hermes-legal exe was not found"
          }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "hermes-legal.exe exited early with code $($proc.ExitCode)"
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          $unins = Get-ChildItem -Path $exe.DirectoryName -Filter "*.exe" |
            Where-Object { $_.Name -match "uninstall" } |
            Select-Object -First 1
          if (-not $unins) { throw "uninstaller was not found next to $($exe.FullName)" }
          Start-Process -FilePath $unins.FullName -ArgumentList "/S" -Wait

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-legal-desktop-windows-pr
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  build-linux-pr:
    name: build-linux (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the Tauri app for Linux (unsigned smoke build)
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles deb,appimage

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-legal-desktop-linux-pr
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  build:
    name: build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Signing material is provided only through repository secrets.
      # Nothing is committed to this repository: no certificate, no
      # private key, no placeholder value. When a secret is absent the
      # build is unsigned and its artifacts are for smoke testing only;
      # they are never published as a release. See desktop/packaging.md.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the Tauri shell and bundles
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-legal-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
