name: CI
on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: a description edit would start a newer CI run whose required
    # checks report skipped, and branch protection then blocks a PR whose head
    # already passed. Description edits are handled by Contribution checks.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    name: offline-tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Offline tests
        run: uv run python -m pytest -q
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: scripts/check.py ci
        run: uv run python scripts/check.py ci
  offline-tests-windows:
    # Windows is a v1 target. Not a required check until it has a track record.
    name: offline-tests-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - name: Offline tests
        run: uv run python -m pytest -q
